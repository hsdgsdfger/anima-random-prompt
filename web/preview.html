<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Prompt Forge 工作台预览</title>
<style>
html,body{margin:0;height:100%;background:#15161a;overflow:hidden}
</style>
</head>
<body>
<script type="module">
import { openPanel } from "./prompt_forge_core_v6.js";
// 假节点：可点、可搜、可收藏，但不写回真实节点
const node = { widgets: [{ name: "template_override", value: "" }], setDirtyCanvas() {} };
openPanel(node);
const p = new URLSearchParams(location.search);
const tab = p.get("tab") || "free";
const q = p.get("q");
if (q) {
  setTimeout(() => {
    const s = document.querySelector(".pf-win .search");
    if (!s) return;
    s.value = q;
    s.dispatchEvent(new Event("input"));
  }, 900);
}
const IDX = { free: 0, tpl: 1, scene: 2 };
setTimeout(() => {
  const tabs = document.querySelectorAll(".pf-win .tab");
  const i = IDX[tab] ?? 0;
  if (tabs[i]) tabs[i].click();
}, 900);
</script>
</body>
</html>
